name: pdf-tools
version: 0.3.0

description: |
  Unified `alolipdf` command-line front-end for the ALOLI PDF tool
  suite — a single compiled megabinary. The ALOLI Crystal tools
  (crystal-combine-pdf, pdf-validate, pdf-signature, watermark) are
  linked in and invoked in-process via each tool's `Cli.run`; poppler's
  `pdfinfo` / `pdffonts` stay shell-outs. One discoverable entry point
  over the whole suite.

authors:
  - Philippe Nénert <philippe@aloli.fr>

crystal: ">= 1.10.0"

license: MIT

# The whole suite is levelled onto `pdf` 1.x, so the tools can be
# compiled together. Each is required by its `src/` path (shard name ≠
# entry file for some) and called in-process — see src/pdf-tools.cr.
dependencies:
  crystal-combine-pdf:
    github: aloli-crystal/crystal-combine-pdf
    version: "~> 1.0.31.40"
  pdf-validate:
    github: aloli-crystal/pdf-validate
    version: "~> 0.47"
  pdf-signature:
    github: aloli-crystal/pdf-signature
    version: "~> 0.12"
  watermark:
    github: aloli-crystal/watermark
    version: "~> 0.1.6"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  alolipdf:
    main: src/cli.cr
